# Checks atomeats.com every 6 hours and notes each product's current price in the Hub.
# (Admins see any difference on the Checks page; prices never change by themselves.)
name: Check atomeats.com prices

on:
  schedule:
    - cron: "15 0,6,12,18 * * *"   # 05:45, 11:45, 17:45 and 23:45 IST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/functions/v1/site-prices" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
